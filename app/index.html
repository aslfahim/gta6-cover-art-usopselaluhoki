<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beach Heist — GTA-style Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover editor controls">
    <h1>Beach Heist</h1>
    <p class="tagline">Your photo, three pastel bands, one sunset heist. Pick a photo per band, drag to crop, export a cover.</p>

    <fieldset>
      <legend>Photos — one per band</legend>
      <div class="band-row">
        <button type="button" data-band="0" class="band-pick active">Sky</button>
        <button type="button" data-band="1" class="band-pick">Pier</button>
        <button type="button" data-band="2" class="band-pick">Sand</button>
      </div>
      <label class="file-label">Photo for the <span id="bandName">Sky</span> band
        <input class="band-photo" data-band="0" type="file" accept="image/*">
      </label>
      <label class="file-label">Photo for the Pier band
        <input class="band-photo" data-band="1" type="file" accept="image/*">
      </label>
      <label class="file-label">Photo for the Sand band
        <input class="band-photo" data-band="2" type="file" accept="image/*">
      </label>
      <p class="hint">Tip: drop a photo straight onto a band in the preview, or drag the preview to pan the photo.</p>
      <button id="fillAll" type="button" class="secondary">Fill all bands with the selected photo</button>
    </fieldset>

    <fieldset>
      <legend>Crop the <span id="bandName2">Sky</span> band</legend>
      <label>Zoom <span id="zoomValue">1.00x</span>
        <input id="zoom" type="range" min="1" max="3" step="0.05" value="1">
      </label>
      <button id="resetCrop" type="button" class="secondary">Reset crop</button>
    </fieldset>

    <fieldset>
      <legend>Caption</legend>
      <label>Main caption
        <input id="caption" type="text" maxlength="30" value="BEACH HEIST">
      </label>
      <label>Caption size <span id="captionSizeValue">100%</span>
        <input id="captionSize" type="range" min="0.6" max="1.6" step="0.05" value="1">
      </label>
      <label>Caption colour
        <input id="captionColor" type="color" value="#ffffff">
      </label>
      <label class="check"><input id="captionOutline" type="checkbox" checked> White sticker outline</label>
      <label>Sub-caption
        <input id="subcaption" type="text" maxlength="24" value="SUMMER 2026">
      </label>
      <label class="check"><input id="badges" type="checkbox" checked> Starburst badges (100% HEIST · VICE CITY)</label>
    </fieldset>

    <fieldset>
      <legend>Export size</legend>
      <div class="size-row">
        <button type="button" data-size="square" class="size-pick active">1080 × 1080</button>
        <button type="button" data-size="portrait" class="size-pick">1080 × 1350</button>
        <button type="button" data-size="wide" class="size-pick">1920 × 1080</button>
      </div>
      <button id="export" type="button">Export PNG</button>
      <p id="status" role="status"></p>
    </fieldset>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="Live cover preview"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
